name: "Task 3: Build and Deploy"

on:
  push:
    branches:
      - main
  # Запуск вручну з вказуванням IP-адреси
  workflow_dispatch:
    inputs:
      target_ip:
        description: 'IP address of the target server (kostiv-node)'
        required: true
        default: ''

jobs:
  build-and-push:
    name: "Build Docker Images"
    runs-on: ubuntu-latest
    steps:
      # 1. Беремо код з репозиторію методички для збірки образу
      - name: Checkout Application Code
        uses: actions/checkout@v4
        with:
          repository: 'YulianSalo/devops-exam-pt2'
          ref: 'main'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Збираємо образ і тегуємо його двома тегами (develop та 1.0.0)
      - name: Build and Push Docker Images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kostiv-app:develop
            ${{ secrets.DOCKERHUB_USERNAME }}/kostiv-app:1.0.0

  deploy:
    name: "Deploy to Minikube"
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Налаштування для DEV середовища
          - env: dev
            port: 8002
            values_file: values-dev.yml
            image_tag: develop
          # Налаштування для RELEASE середовища
          - env: release
            port: 8003
            values_file: values-release.yml 
            image_tag: "1.0.0"
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy values files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ github.event.inputs.target_ip }}
          username: root
          password: ${{ secrets.VM_PASSWORD }}
          source: "task3/values-*.yml"
          target: "/root/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ github.event.inputs.target_ip }}
          username: root
          password: ${{ secrets.VM_PASSWORD }}
          command_timeout: 30m
          script: |
            # 0. Додавання шляху до виконуваних файлів
            export PATH=$PATH:/usr/local/bin

            # 1. Запуск Minikube
            if ! minikube status | grep -q "Running"; then
              minikube start --driver=docker
            fi

            # 2. Завантаження Helm-чарту
            rm -rf devops-exam-pt2
            git clone https://github.com/YulianSalo/devops-exam-pt2.git
            cd devops-exam-pt2/helm-charts-hello-world

            # 3. ПЕРЕВІРКА (Dry-run)
            echo "--- STARTING DRY-RUN FOR ${{ matrix.env }} ---"
            helm upgrade --install my-app-${{ matrix.env }} . \
              -f /root/task3/${{ matrix.values_file }} \
              --namespace ${{ matrix.env }} --create-namespace \
              --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/kostiv-app \
              --set image.tag=${{ matrix.image_tag }} \
              --set service.nodePort=${{ matrix.port }} \
              --dry-run --debug

            # 4. РЕАЛЬНЕ РОЗГОРТАННЯ
            echo "--- STARTING REAL DEPLOY FOR ${{ matrix.env }} ---"
            helm upgrade --install my-app-${{ matrix.env }} . \
              -f /root/task3/${{ matrix.values_file }} \
              --namespace ${{ matrix.env }} --create-namespace \
              --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/kostiv-app \
              --set image.tag=${{ matrix.image_tag }} \
              --set service.nodePort=${{ matrix.port }} \
              --wait

            # 5. Налаштування Port-forwarding для доступу ззовні
            echo "--- SETTING UP PORT-FORWARDING FOR ${{ matrix.env }} ---"
            fuser -k ${{ matrix.port }}/tcp || true
            nohup kubectl port-forward --address 0.0.0.0 service/my-app-${{ matrix.env }} ${{ matrix.port }}:80 -n ${{ matrix.env }} > /root/pf-${{ matrix.env }}.log 2>&1 &