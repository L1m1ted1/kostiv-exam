name: "Task 3: Build and Deploy"

on:
  push:
    branches:
      - main
    paths:
      - 'task3/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонуємо репозиторій з кодом застосунку (методичка)
      - name: Checkout App Code
        uses: actions/checkout@v4
        with:
          repository: 'YulianSalo/devops-exam-pt2'
          ref: 'develop' # або інша гілка, де лежить код

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Збірка образів згідно з вимогами (develop та 1.0.0)
      - name: Build and Push Images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kostiv-app:develop
            ${{ secrets.DOCKERHUB_USERNAME }}/kostiv-app:1.0.0

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: dev
            port: 8002
            file: values-dev.yaml
          - env: release
            port: 8003
            file: values-release.yaml
    
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Minikube via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: root
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            # Перевірка (Dry-run) для середовища ${{ matrix.env }}
            helm upgrade --install my-app-${{ matrix.env }} ./task3/my-app \
              -f ./task3/${{ matrix.file }} \
              --dry-run --debug

            # Реальне розгортання
            helm upgrade --install my-app-${{ matrix.env }} ./task3/my-app \
              -f ./task3/${{ matrix.file }} \
              --set service.nodePort=${{ matrix.port }} \
              --wait