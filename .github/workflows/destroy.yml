name: "Task 1: Terraform Destroy"

# Налаштовуємо запуск ТІЛЬКИ вручну для безпеки
on:
  workflow_dispatch:

jobs:
  terraform-destroy:
    name: "Destroy Infrastructure"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./task1

    env:
      TF_VAR_do_token: ${{ secrets.DO_PAT }}
      TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      TF_VAR_root_password: ${{ secrets.VM_PASSWORD }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # Команда для повного видалення ресурсів
      - name: Terraform Destroy
        run: terraform destroy -auto-approve