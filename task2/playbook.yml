---
- name: "Task 2: Install Kubernetes Environment (Minikube, Helm, Kubectl)"
  hosts: all
  become: yes
  vars:
    # Версія Helm (можна залишити останню через скрипт)
    minikube_version: "latest"

  tasks:
    - name: Update apt and install base dependencies
      apt:
        update_cache: yes
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - conntrack
          - git
        state: present

    - name: Install Docker Engine (Runtime for Minikube)
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Ensure Docker service is started and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add root user to docker group
      user:
        name: root
        groups: docker
        append: yes

    - name: Download and Install Minikube
      get_url:
        url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-amd64"
        dest: /usr/local/bin/minikube
        mode: '0755'

    - name: Get latest stable kubectl version
      uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: yes
      register: kubectl_version

    - name: Download and Install kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.content | trim }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Install Helm 3 via official script
      shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Configure Minikube to use Docker driver by default
      command: minikube config set driver docker
      become_user: root

    - name: Start Minikube to initialize cluster
      shell: |
        if ! minikube status | grep -q "Running"; then
          minikube start --driver=docker --force
        fi
      become_user: root
      register: minikube_start
      changed_when: "minikube_start.stdout is defined and 'Done! kubectl is now configured' in minikube_start.stdout"

    - name: Install kubectl proxy systemd service (for "Proxying to Minikube" requirement)
      copy:
        dest: /etc/systemd/system/kubectl-proxy.service
        content: |
          [Unit]
          Description=Kubectl Proxy
          After=network.target

          [Service]
          Environment="KUBECONFIG=/root/.kube/config"
          ExecStart=/usr/local/bin/kubectl proxy --address='0.0.0.0' --port=8001 --accept-hosts='.*'
          Restart=always
          User=root

          [Install]
          WantedBy=multi-user.target

    - name: Start and enable kubectl proxy
      systemd:
        name: kubectl-proxy
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: Verify installations
      shell: |
        docker --version
        minikube version
        kubectl version --client
        helm version
      register: versions_output
      check_mode: no

    - name: Show installed versions
      debug:         
        msg: "{{ versions_output.stdout_lines }}"