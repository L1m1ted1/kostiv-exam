environment: release
image:
  tag: "1.0.0"
  pullPolicy: IfNotPresent
  pullSecret: "default"
  repository: "will-be-overridden-by-set"
service:
  type: NodePort
  port: 80
  nodePort: 8003
replicaCount: 2
serviceAccount:
  create: false
ingress:
  enabled: false
autoscaling:
  enabled: false
httpRoute:
  enabled: false
django:
  debug: "False"
  allowedHosts: "*"